<svg viewBox="0 0 916 241" width="100%" role="img" aria-label="Real acyclic Tox21 molecules, which have no Murcko scaffold at all" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
<style>
.cell{fill:var(--paper,#F6F5F2);stroke:var(--rule,#D8D7D1);stroke-width:1}
